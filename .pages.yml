# Configurazione del pannello Pages CMS per il sito Fabio Costa Ph
# Documentazione: https://pagescms.org/docs/configuration/

media:
  input: img/foto
  output: /img/foto
  categories: [image]

content:
  # ---------------------------------------------------------------
  # VIAGGI (ogni viaggio = un astronauta sulla mappa) e le loro FOTO
  # ---------------------------------------------------------------
  - name: viaggi
    label: Viaggi e foto
    type: file
    path: content/viaggi.json
    format: json
    fields:
      - name: viaggi
        label: Viaggi
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nome}"
        fields:
          - name: nome
            label: Nome del luogo
            type: string
            required: true
            description: "Come apparirà sulla mappa e nella Gallery, es. Islanda"
          - name: id
            label: Codice del viaggio
            type: string
            required: true
            description: "Breve, minuscolo, senza spazi né accenti (es. islanda, cinque-terre). Non cambiarlo dopo averlo creato."
          - name: paese
            label: Nazione
            type: string
          - name: collezione
            label: Collezione o serie (facoltativa)
            type: string
            description: "Raggruppa più viaggi sotto un unico nome, es. Dolomiti oppure Blue hour. Scrivi lo stesso nome identico in ogni viaggio della collezione: nella Gallery compare un filtro e su Explore i viaggi vengono elencati insieme."
          - name: lat
            label: Latitudine (dove mettere l'astronauta)
            type: string
            required: true
            description: "Su Google Maps fai clic destro sul punto e clicca sui numeri per copiarli: il PRIMO è la latitudine (es. 64.9631)."
          - name: lon
            label: Longitudine
            type: string
            required: true
            description: "Il SECONDO numero (es. -19.0208). A ovest di Greenwich e a sud dell'equatore il numero ha il segno meno."
          - name: inizio
            label: Data di inizio (facoltativa)
            type: string
            description: "Formato anno-mese-giorno, es. 2026-10-31. Puoi lasciarla vuota."
          - name: fine
            label: Data di fine (facoltativa)
            type: string
            description: "Formato anno-mese-giorno, es. 2026-10-31. Puoi lasciarla vuota."
          - name: descrizione
            label: Descrizione breve
            type: text
            description: "Una o due frasi: compaiono nel riquadro del viaggio sulla mappa."
          - name: articolo
            label: Articolo collegato (facoltativo)
            type: string
            description: "L'indirizzo di un articolo del Journal, es. islanda. Lascia vuoto se non c'è."
          - name: categoria
            label: Categoria delle foto caricate insieme
            type: select
            default: Paesaggi
            options:
              values: [Paesaggi, Urban, Astrofotografia, Lunga esposizione, Altro]
            description: "Vale per le foto qui sotto in «Carica più foto insieme» (e per le sottosezioni, se non scegli altro)."
          - name: immagini
            label: Carica più foto insieme
            type: image
            description: "Il modo veloce: seleziona o carica tutte le foto del viaggio in una volta. Prendono il nome del viaggio come titolo. Se a una foto vuoi dare un titolo, una data o una descrizione, mettila invece in «Foto una per una»."
            options:
              multiple: { max: 200 }
              extensions: [jpg, jpeg, png, webp]
              rename: true
          - name: foto
            label: Foto una per una (con titolo, data e descrizione)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titolo}"
            fields:
              - name: titolo
                label: Titolo
                type: string
                required: true
              - name: immagine
                label: Fotografia
                type: image
                required: true
                options:
                  extensions: [jpg, jpeg, png, webp]
                  rename: true
              - name: data
                label: Data dello scatto (facoltativa)
                type: string
                description: "Formato anno-mese-giorno, es. 2026-10-31. Puoi lasciarla vuota."
              - name: categoria
                label: Categoria
                type: select
                default: Paesaggi
                options:
                  values: [Paesaggi, Urban, Astrofotografia, Lunga esposizione, Altro]
              - name: lat
                label: Latitudine dello scatto (facoltativa)
                type: string
                description: "Lascia vuoto per usare quella del viaggio."
              - name: lon
                label: Longitudine dello scatto (facoltativa)
                type: string
              - name: fotocamera
                label: Fotocamera (facoltativa)
                type: string
                description: "Es. Sony A7 IV. Se la lasci vuota il sito prova a leggerla dalla foto (dati EXIF)."
              - name: obiettivo
                label: Obiettivo (facoltativo)
                type: string
                description: "Es. 16-35mm f/2.8"
              - name: scatto
                label: Parametri di scatto (facoltativi)
                type: string
                description: "Es. 24mm · f/8 · 1/250s · ISO 100"
              - name: descrizione
                label: Descrizione
                type: text

          - name: sottosezioni
            label: Sottosezioni (facoltative)
            type: object
            description: "I luoghi dentro il viaggio, es. Roma → Tempio di Esculapio. Ognuna ha le sue foto; sul sito diventano dei pulsanti nel riquadro del viaggio."
            list:
              collapsible:
                collapsed: true
                summary: "{nome}"
            fields:
              - name: nome
                label: Nome della sottosezione
                type: string
                required: true
                description: "Es. Tempio di Esculapio"
              - name: lat
                label: Latitudine (facoltativa)
                type: string
                description: "Lascia vuoto per usare quella del viaggio."
              - name: lon
                label: Longitudine (facoltativa)
                type: string
              - name: descrizione
                label: Descrizione breve
                type: text
              - name: categoria
                label: Categoria delle foto
                type: select
                options:
                  values: [Paesaggi, Urban, Astrofotografia, Lunga esposizione, Altro]
                description: "Lascia vuoto per usare quella del viaggio."
              - name: immagini
                label: Carica più foto insieme
                type: image
                options:
                  multiple: { max: 200 }
                  extensions: [jpg, jpeg, png, webp]
                  rename: true
              - name: foto
                label: Foto una per una (con titolo, data e descrizione)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titolo}"
                fields:

                    - name: titolo
                      label: Titolo
                      type: string
                      required: true
                    - name: immagine
                      label: Fotografia
                      type: image
                      required: true
                      options:
                        extensions: [jpg, jpeg, png, webp]
                        rename: true
                    - name: data
                      label: Data dello scatto (facoltativa)
                      type: string
                      description: "Formato anno-mese-giorno, es. 2026-10-31. Puoi lasciarla vuota."
                    - name: categoria
                      label: Categoria
                      type: select
                      default: Paesaggi
                      options:
                        values: [Paesaggi, Urban, Astrofotografia, Lunga esposizione, Altro]
                    - name: lat
                      label: Latitudine dello scatto (facoltativa)
                      type: string
                      description: "Lascia vuoto per usare quella della sottosezione."
                    - name: lon
                      label: Longitudine dello scatto (facoltativa)
                      type: string
                    - name: fotocamera
                      label: Fotocamera (facoltativa)
                      type: string
                      description: "Es. Sony A7 IV. Se la lasci vuota il sito prova a leggerla dalla foto (dati EXIF)."
                    - name: obiettivo
                      label: Obiettivo (facoltativo)
                      type: string
                      description: "Es. 16-35mm f/2.8"
                    - name: scatto
                      label: Parametri di scatto (facoltativi)
                      type: string
                      description: "Es. 24mm · f/8 · 1/250s · ISO 100"
                    - name: descrizione
                      label: Descrizione
                      type: text

  # ---------------------------------------------------------------
  # ARTICOLI DEL JOURNAL
  # ---------------------------------------------------------------
  - name: articoli
    label: Articoli del Journal
    type: file
    path: content/articoli.json
    format: json
    fields:
      - name: articoli
        label: Articoli
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titolo}"
        fields:
          - name: titolo
            label: Titolo
            type: string
            required: true
          - name: slug
            label: Indirizzo dell'articolo
            type: string
            required: true
            description: "Breve, minuscolo, senza spazi né accenti (es. islanda). Diventa il link: tuosito.it/#art-islanda"
          - name: tipo
            label: Tipo di articolo
            type: select
            default: Guida pratica
            options:
              values: [Reportage, Guida pratica]
            description: "Reportage = il racconto (stile Epoca/Bonatti): foto a tutta pagina, testo in una colonna. Guida pratica = due colonne e il riquadro «In breve»."
          - name: categoria
            label: Tema
            type: select
            default: Luoghi
            options:
              values: [Attualità, Luoghi, Viaggi, Persone, Natura, Fotografia, Tecnica, Guide pratiche, Ispirazione]
          - name: luogo
            label: Luogo e periodo (facoltativo)
            type: string
            description: "Compare sotto il titolo come nei vecchi reportage, es. «Patagonia, febbraio 2026»."
          - name: data
            label: Data di pubblicazione
            type: date
            options:
              format: yyyy-MM-dd
          - name: minuti
            label: Minuti di lettura
            type: number
            options:
              min: 0
          - name: copertina
            label: Immagine di copertina
            type: image
            options:
              extensions: [jpg, jpeg, png, webp]
              rename: true
          - name: estratto
            label: Estratto
            type: text
            description: "Due righe che compaiono nell'elenco del Journal."
          - name: testo
            label: Testo dell'articolo
            type: rich-text
            options:
              format: markdown
              rename: true
          - name: autore
            label: Autore (lascia vuoto se sei tu)
            type: object
            description: "Per gli articoli dei contributor: nome, Instagram, sito e due righe di bio. Compare nella firma e nella pagina autore."
            fields:
              - { name: nome, label: Nome e cognome, type: string }
              - { name: instagram, label: Instagram (solo il nome utente), type: string }
              - { name: sito, label: Sito web, type: string }
              - { name: bio, label: Bio breve, type: text }
              - { name: foto, label: Foto dell'autore, type: image }
          - name: in_breve
            label: In breve — informazioni pratiche (tutto facoltativo)
            type: object
            description: "Compare come riquadro «At a glance». Lascia vuoto quello che non serve."
            fields:
              - { name: periodo, label: Periodo e ora migliori, type: string }
              - { name: arrivare, label: Come arrivare, type: string }
              - { name: parcheggio, label: Dove parcheggiare, type: string }
              - { name: camminata, label: Camminata (tempo, dislivello), type: string }
              - { name: difficolta, label: Difficoltà, type: string }
              - { name: permessi, label: Permessi e regole (drone, ZTL, accessi), type: string }
              - { name: attrezzatura, label: Attrezzatura, type: string }
              - { name: impostazioni, label: Impostazioni di scatto, type: string }
          - name: viaggio
            label: Viaggio collegato (facoltativo)
            type: string
            description: "Il codice del viaggio, es. islanda: aggiunge il pulsante «Vedi il viaggio sulla mappa»."

  # ---------------------------------------------------------------
  # RIVISTA DEL MESE (Field Notes From Planet Earth)
  # ---------------------------------------------------------------
  - name: rivista
    label: Rivista del mese (copertine)
    type: file
    path: content/rivista.json
    format: json
    fields:
      - name: numeri
        label: Copertine dei numeri
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{mese}"
        description: "Ogni mese gli articoli del Journal diventano un numero di «Field Notes From Planet Earth». Qui scegli la foto di copertina di quel mese: compare sul sito (modalità rivista) e sulla prima pagina del PDF. Se non la metti, si usa la copertina dell'articolo più recente."
        fields:
          - name: mese
            label: Mese (anno-mese)
            type: string
            required: true
            description: "Es. 2026-11 per novembre 2026."
          - name: copertina
            label: Foto di copertina
            type: image
            required: true
            options:
              extensions: [jpg, jpeg, png, webp]
              rename: true
          - name: titolo
            label: Titolo di copertina (facoltativo)
            type: string
            description: "Una riga sulla copertina, es. «Inverno sulle Dolomiti»."

  # ---------------------------------------------------------------
  # PAGINA CHI SONO
  # ---------------------------------------------------------------
  - name: chi-sono
    label: Pagina Chi sono
    type: file
    path: content/chi-sono.json
    format: json
    fields:
      - name: proprietario
        label: Nome e cognome (titolare del sito)
        type: string
        description: "Compare nella pagina About, nel fondo pagina (©) e nei dati letti dai motori di ricerca."
      - name: email
        label: Email per i contatti
        type: string
        description: "Compare nella pagina About e in fondo al sito."
      - name: instagram
        label: Instagram (solo il nome utente)
        type: string
        description: "Es. fabiocostaph, senza @ e senza link."
      - name: titolo
        label: Titolo
        type: string
      - name: presentazione
        label: Presentazione
        type: rich-text
        options:
          format: markdown
      - name: ritratto
        label: Foto ritratto (rotonda)
        type: image
      - name: immagine
        label: Fotografia accanto al testo
        type: image
      - name: interessi
        label: Interessi
        type: string
        list: true
      - name: citazione
        label: Citazione
        type: text
      - name: attrezzatura
        label: My Gear
        type: rich-text
        options:
          format: markdown
      - name: partenza
        label: Punto di partenza delle rotte sulla mappa
        type: object
        fields:
          - name: nome
            label: Città
            type: string
          - name: lat
            label: Latitudine
            type: string
          - name: lon
            label: Longitudine
            type: string

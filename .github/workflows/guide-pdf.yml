name: Guide in PDF (comprimi e sposta)
# Quando dal pannello carichi il PDF di una guida (Canva o altro) in guides/pdf/, questo lavoro:
#   1. lo comprime (Ghostscript: immagini a 150 dpi, quanto basta per schermo e stampa a casa); se non si riduce, tiene l'originale;
#   2. lo pubblica come file scaricabile della release «guide-pdf» (non pesa sul sito né sulla sua pubblicazione);
#   3. aggiorna content/guide.json con il nuovo indirizzo e la dimensione, e toglie il PDF dalla cartella del sito.
on:
  push:
    paths: ["guides/pdf/**", "content/guide.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: guide-pdf
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript jq >/dev/null
      - name: Comprimi, pubblica, aggiorna
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          shopt -s nullglob nocaseglob
          mkdir -p guides/files
          # 1. every PDF uploaded from the panel: compress it and keep it in guides/files (read on the site, light)
          for f in guides/pdf/*.pdf; do
            name=$(basename "$f"); out="guides/files/$name"
            gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dCompatibilityLevel=1.6 -dPDFSETTINGS=/ebook \
              -dDownsampleColorImages=true -dColorImageResolution=150 -dDownsampleGrayImages=true -dGrayImageResolution=150 \
              -dDetectDuplicateImages=true -dCompressFonts=true -sOutputFile="$out" "$f" || cp "$f" "$out"
            before=$(stat -c%s "$f"); after=$(stat -c%s "$out")
            if [ "$after" -ge "$before" ]; then cp "$f" "$out"; fi
            echo "$name: $((before/1024)) KB → $(( $(stat -c%s "$out")/1024 )) KB"
            git rm -q "$f"; git add "$out"
          done
          # 2. every guide pointing to an uploaded file (the panel can save the guide before or after the file):
          #    point it to the light copy, with its size
          for out in guides/files/*.pdf; do
            name=$(basename "$out"); size=$(stat -c%s "$out")
            mb=$(awk "BEGIN{v=$size/1048576; printf \"%.1f\", (v<0.1?0.1:v)}")
            tmp=$(mktemp)
            jq --arg n "$name" --arg u "/guides/files/$name" --arg mb "$mb" \
              '(.pdf // []) |= map(if ((.file // "") | test("(^|/)(guides/pdf|guides/files|releases/download/guide-pdf)/" + ($n | gsub("[.]"; "[.]")) + "$")) then .file = $u | .mb = $mb else . end)' content/guide.json > "$tmp" && mv "$tmp" content/guide.json
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/guide.json
          git diff --cached --quiet && { echo "Nessuna novità."; exit 0; }
          git commit -m "Guide PDF compressi e spostati tra i file scaricabili"
          git pull --rebase -q && git push

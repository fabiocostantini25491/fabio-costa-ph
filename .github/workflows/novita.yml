name: Novità della home
on:
  push:
    branches: [main]
    paths: ["content/articoli.json", "content/viaggi.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: novita
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/track-new.mjs
      - name: Salva
        run: |
          if git diff --quiet content/novita.json 2>/dev/null && git ls-files --error-unmatch content/novita.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/novita.json
          git commit -m "Novità: date di inserimento [skip ci]"
          git pull --rebase
          git push

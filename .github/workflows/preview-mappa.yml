name: Anteprima mappa
on:
  push:
    branches: [preview-mappa]
    paths-ignore: ["preview/**", "content/sestieri-venezia.json"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm install --no-save --no-package-lock playwright@1 osmtogeojson
          npx playwright install --with-deps chromium
      - run: |
          git fetch -q origin main && git checkout origin/main -- guida.html guida.js guida.css vendor img guides content/guide.json 2>/dev/null || true
          node scripts/sestieri.cjs
          (python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 2
          node scripts/preview-guida.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset -q; git add preview && git commit -m "Anteprima mappa [skip ci]" && git push
